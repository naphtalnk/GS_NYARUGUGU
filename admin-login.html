
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Nyarugugu Admin Login</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eaf1ec;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #0002;
        }

        .login-box h2 {
            color: #073b2a;
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-box button {
            width: 100%;
            margin-top: 15px;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>GS NYARUGUGU</h2>
    <p>Administrator Login</p>

    <form id="loginForm">
        <input type="text" id="username"
               placeholder="Admin Username" required>

        <input type="password" id="password"
               placeholder="Admin Password" required>

        <button type="submit" class="primary-btn">
            LOGIN
        </button>
    </form>

    <p id="message"></p>
</div>

<script src="admin-login.js"></script>
</body>
</html>
